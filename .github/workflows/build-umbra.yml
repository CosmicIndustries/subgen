name: Build Umbra APK

on:
  push:
    branches: ["**"]
    paths:
      - "umbra/**"
      - ".github/workflows/build-umbra.yml"
  pull_request:
    paths:
      - "umbra/**"
      - ".github/workflows/build-umbra.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: umbra
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24.7"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install NDK + CMake
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build WireGuard Go bridge (all ABIs)
        env:
          NDK_TOOLCHAIN: /usr/local/lib/android/sdk/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin
        run: |
          set -e
          declare -A GOARCHES=( [arm64-v8a]=arm64 [armeabi-v7a]=arm [x86_64]=amd64 )
          declare -A TARGETS=( [arm64-v8a]=aarch64-linux-android26 [armeabi-v7a]=armv7a-linux-androideabi26 [x86_64]=x86_64-linux-android26 )
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "app/src/main/jniLibs/$abi"
            CC="$NDK_TOOLCHAIN/${TARGETS[$abi]}-clang" \
            CGO_ENABLED=1 GOOS=android GOARCH="${GOARCHES[$abi]}" \
            go build -C app/src/main/go -buildmode=c-shared \
              -o "$PWD/app/src/main/jniLibs/$abi/libwgbridge.so" .
          done

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Every version in gradle/libs.versions.toml is already an exact pin,
      # but that doesn't cover transitive dependencies pulled in without a
      # version of their own choosing. Regenerating the lockfile from the
      # real, network-connected resolution on every run keeps it honest —
      # a stale committed lockfile would just be a false sense of security.
      - name: Generate dependency locks
        run: ./gradlew dependencies --write-locks

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: umbra-debug-apk
          path: umbra/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Actions artifacts are only fetchable via a signed Azure Blob Storage
      # URL, which isn't reachable from every environment that might want to
      # grab the APK. A release asset is served from github.com's own domain
      # instead, so this also publishes one on every push to a branch.
      - name: Publish APK as a release asset
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="umbra-build-${{ github.run_number }}"
          gh release create "$TAG" \
            app/build/outputs/apk/debug/*.apk \
            --repo "${{ github.repository }}" \
            --title "Umbra debug build #${{ github.run_number }}" \
            --notes "Automated debug build from commit ${{ github.sha }}. Not signed for release; for testing only." \
            --prerelease

      # [skip ci] avoids re-triggering this same workflow on its own commit
      # (the trigger's paths filter includes umbra/**, which these lockfiles
      # live under).
      - name: Commit updated dependency lockfile
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in gradle.lockfile app/gradle.lockfile; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "Lockfile already up to date."
          else
            git commit -m "Update Gradle dependency lockfile [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
