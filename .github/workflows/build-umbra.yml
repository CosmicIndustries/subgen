name: Build Umbra APK

on:
  push:
    branches: ["**"]
    paths:
      - "umbra/**"
      - ".github/workflows/build-umbra.yml"
  pull_request:
    paths:
      - "umbra/**"
      - ".github/workflows/build-umbra.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: umbra
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: umbra-debug-apk
          path: umbra/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Actions artifacts are only fetchable via a signed Azure Blob Storage
      # URL, which isn't reachable from every environment that might want to
      # grab the APK. A release asset is served from github.com's own domain
      # instead, so this also publishes one on every push to a branch.
      - name: Publish APK as a release asset
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="umbra-build-${{ github.run_number }}"
          gh release create "$TAG" \
            app/build/outputs/apk/debug/*.apk \
            --repo "${{ github.repository }}" \
            --title "Umbra debug build #${{ github.run_number }}" \
            --notes "Automated debug build from commit ${{ github.sha }}. Not signed for release; for testing only." \
            --prerelease
